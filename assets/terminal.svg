<svg xmlns="http://www.w3.org/2000/svg" width="820" height="372" viewBox="0 0 820 372">
  <defs>
    <linearGradient id="neon" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff"/><stop offset=".5" stop-color="#7a5cff"/><stop offset="1" stop-color="#ff2bd6"/></linearGradient>
  </defs>
  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace;font-size:14px}
    .cover{transform-box:fill-box;transform-origin:right center;animation:type 1s steps(28) forwards}
    @keyframes type{to{transform:scaleX(0)}}
    .fill{transform-box:fill-box;transform-origin:left center;transform:scaleX(0);animation:grow 1.1s cubic-bezier(.2,.8,.2,1) forwards}
    @keyframes grow{to{transform:scaleX(1)}}
    .fade{opacity:0;animation:fade .2s forwards}
    @keyframes fade{to{opacity:1}}
    .cur{opacity:0;animation:fade .1s 7.6s forwards,blink 1s steps(1) 7.8s infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <rect x="1" y="1" width="818" height="370" rx="12" fill="#0b0f17" stroke="url(#neon)" stroke-opacity=".6" stroke-width="2"/>
  <path d="M1 13A12 12 0 0 1 13 1H807A12 12 0 0 1 819 13V36H1Z" fill="#111827"/>
  <circle cx="22" cy="18" r="6" fill="#ff5f56"/><circle cx="42" cy="18" r="6" fill="#ffbd2e"/><circle cx="62" cy="18" r="6" fill="#27c93f"/>
  <text class="mono" x="410" y="23" font-size="12" fill="#7d8ba3" text-anchor="middle" style="font-size:12px">gustavo@nexus: ~/objetivos — zsh</text>

  <g class="mono">
    <text x="28" y="74"><tspan fill="#39ff88">➜</tspan> <tspan fill="#00f0ff">~/objetivos</tspan> <tspan fill="#e6edf3">./status --missoes-atuais</tspan></text>
    <rect class="cover" x="24" y="58" width="420" height="24" fill="#0b0f17" style="animation-delay:.3s"/>

    <text x="28" y="104" fill="#7d8ba3">[SYS] 5 missões carregadas. Exibindo progresso...</text>
    <rect class="cover" x="24" y="88" width="440" height="24" fill="#0b0f17" style="animation-delay:1.5s"/>

    <!-- missão 1 -->
    <text x="28" y="140"><tspan fill="#ff2bd6">▸</tspan> <tspan fill="#e6edf3">Dominar Java, C e Python a fundo</tspan></text>
    <rect class="cover" x="24" y="124" width="420" height="24" fill="#0b0f17" style="animation-delay:2.4s"/>
    <rect x="470" y="130" width="240" height="10" rx="5" fill="#1a2233"/>
    <rect class="fill" x="470" y="130" width="180" height="10" rx="5" fill="url(#neon)" style="animation-delay:3s"/>
    <text class="fade" x="790" y="140" fill="#00f0ff" text-anchor="end" style="animation-delay:4s">75%</text>

    <!-- missão 2 -->
    <text x="28" y="174"><tspan fill="#ff2bd6">▸</tspan> <tspan fill="#e6edf3">Machine Learning aplicado à indústria</tspan></text>
    <rect class="cover" x="24" y="158" width="420" height="24" fill="#0b0f17" style="animation-delay:3.1s"/>
    <rect x="470" y="164" width="240" height="10" rx="5" fill="#1a2233"/>
    <rect class="fill" x="470" y="164" width="144" height="10" rx="5" fill="url(#neon)" style="animation-delay:3.7s"/>
    <text class="fade" x="790" y="174" fill="#00f0ff" text-anchor="end" style="animation-delay:4.7s">60%</text>

    <!-- missão 3 -->
    <text x="28" y="208"><tspan fill="#ff2bd6">▸</tspan> <tspan fill="#e6edf3">Aprender SQL e modelagem de dados</tspan></text>
    <rect class="cover" x="24" y="192" width="420" height="24" fill="#0b0f17" style="animation-delay:3.8s"/>
    <rect x="470" y="198" width="240" height="10" rx="5" fill="#1a2233"/>
    <rect class="fill" x="470" y="198" width="84" height="10" rx="5" fill="url(#neon)" style="animation-delay:4.4s"/>
    <text class="fade" x="790" y="208" fill="#00f0ff" text-anchor="end" style="animation-delay:5.4s">35%</text>

    <!-- missão 4 -->
    <text x="28" y="242"><tspan fill="#ff2bd6">▸</tspan> <tspan fill="#e6edf3">Criar interfaces no Figma</tspan></text>
    <rect class="cover" x="24" y="226" width="420" height="24" fill="#0b0f17" style="animation-delay:4.5s"/>
    <rect x="470" y="232" width="240" height="10" rx="5" fill="#1a2233"/>
    <rect class="fill" x="470" y="232" width="72" height="10" rx="5" fill="url(#neon)" style="animation-delay:5.1s"/>
    <text class="fade" x="790" y="242" fill="#00f0ff" text-anchor="end" style="animation-delay:6.1s">30%</text>

    <!-- missão 5 -->
    <text x="28" y="276"><tspan fill="#ff2bd6">▸</tspan> <tspan fill="#e6edf3">Contribuir com projetos open source</tspan></text>
    <rect class="cover" x="24" y="260" width="420" height="24" fill="#0b0f17" style="animation-delay:5.2s"/>
    <rect x="470" y="266" width="240" height="10" rx="5" fill="#1a2233"/>
    <rect class="fill" x="470" y="266" width="48" height="10" rx="5" fill="url(#neon)" style="animation-delay:5.8s"/>
    <text class="fade" x="790" y="276" fill="#00f0ff" text-anchor="end" style="animation-delay:6.8s">20%</text>

    <!-- final -->
    <text x="28" y="320"><tspan fill="#39ff88">➜</tspan> <tspan fill="#00f0ff">~/objetivos</tspan> <tspan fill="#e6edf3">echo "sempre compilando novas ideias"</tspan></text>
    <rect class="cover" x="24" y="304" width="560" height="24" fill="#0b0f17" style="animation-delay:6.2s"/>
    <text x="28" y="350" fill="#39ff88">&gt; sempre compilando novas ideias</text>
    <rect class="cover" x="24" y="334" width="320" height="24" fill="#0b0f17" style="animation-delay:7s;animation-duration:.6s"/>
    <rect class="cur" x="316" y="338" width="9" height="16" fill="#00f0ff"/>
  </g>
</svg>
