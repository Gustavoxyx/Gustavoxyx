    <linearGradient id="light" x1="0" x2="1"><stop offset="0" stop-color="#00f0ff" stop-opacity="0"/><stop offset=".5" stop-color="#e8ffff"/><stop offset="1" stop-color="#00f0ff" stop-opacity="0"/></linearGradient>
