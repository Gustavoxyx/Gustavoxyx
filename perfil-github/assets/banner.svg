<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03050a"/>
      <stop offset="1" stop-color="#0a1022"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset=".5" stop-color="#7a5cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="scanG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00f0ff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#00f0ff" stop-opacity=".10"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="core">
      <stop offset="0" stop-color="#e8ffff"/>
      <stop offset=".35" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#00f0ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#00f0ff" stroke-opacity=".06"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect width="1200" height="340" rx="18"/></clipPath>
  </defs>

  <style>
    .mono{font-family:'JetBrains Mono','Fira Code',Consolas,'Courier New',monospace}
    .boot{fill:#7dfcff;font-size:13px;opacity:0;animation:show .05s forwards}
    .ok{fill:#39ff88;font-weight:700}
    .dim{fill:#4b6a8a}
    .l1{animation-delay:.3s}.l1b{animation-delay:.65s}
    .l2{animation-delay:.8s}.l2b{animation-delay:1.15s}
    .l3{animation-delay:1.3s}.l3b{animation-delay:1.65s}
    .l4{animation-delay:1.8s}.l4b{animation-delay:2.15s}
    .l5{animation-delay:2.3s}.l5b{animation-delay:2.65s}
    .l6{animation-delay:2.8s}.l6b{animation-delay:3.15s}
    @keyframes show{to{opacity:1}}
    .bar{transform-origin:40px 0;transform:scaleX(0);animation:fill 1.4s cubic-bezier(.2,.8,.2,1) 3.2s forwards}
    @keyframes fill{to{transform:scaleX(1)}}
    .pct{opacity:0;animation:show .05s 4.6s forwards}
    .title{opacity:0;animation:rise .9s ease-out 4.8s forwards}
    .sub{opacity:0;animation:rise .8s ease-out 5.4s forwards}
    @keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .gl1,.gl2{opacity:0;animation:glitch 4s steps(1) 7s infinite}
    .gl2{animation-delay:7.1s}
    @keyframes glitch{0%,88%,100%{opacity:0;transform:translate(0,0)}90%{opacity:.8;transform:translate(-5px,1px)}93%{opacity:.8;transform:translate(4px,-2px)}96%{opacity:0}}
    .scan{animation:scan 5s linear infinite}
    @keyframes scan{from{transform:translateY(0)}to{transform:translateY(440px)}}
    .blink{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
    .hud{opacity:0;animation:show 1s ease-out 1s forwards}
    .spin{transform-origin:1010px 170px;animation:spin 14s linear infinite}
    .spinR{transform-origin:1010px 170px;animation:spin 9s linear infinite reverse}
    .spin2{transform-origin:1010px 170px;animation:spin 5s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .pulse{transform-origin:1010px 170px;animation:pulse 2.4s ease-in-out infinite}
    @keyframes pulse{50%{transform:scale(.8);opacity:.55}}
  </style>

  <g clip-path="url(#frame)">
    <rect width="1200" height="340" fill="url(#bg)"/>
    <rect width="1200" height="340" fill="url(#grid)"/>
    <rect class="scan" x="0" y="-100" width="1200" height="100" fill="url(#scanG)"/>

    <!-- cantos HUD -->
    <g fill="none" stroke="#00f0ff" stroke-width="2" stroke-opacity=".7">
      <path d="M16 46V16H46"/><path d="M1154 16H1184V46"/>
      <path d="M16 294V324H46"/><path d="M1184 294V324H1154"/>
    </g>

    <!-- topo -->
    <text class="mono" x="40" y="32" font-size="12" fill="#39ff88">gustavo@nexus:~$ <tspan fill="#c9d1d9">boot --sequence=full --user=gustavo_nunes</tspan></text>
    <text class="mono blink" x="1170" y="32" font-size="11" fill="#ff2bd6" text-anchor="end">● REC // SYS.v2.6</text>

    <!-- log de boot -->
    <g class="mono">
      <text class="boot l1" x="40" y="62"><tspan class="dim">[ 0.001 ]</tspan> NEXUS BIOS — inicializando kernel...</text>
      <text class="boot ok l1b" x="620" y="62">[  OK  ]</text>
      <text class="boot l2" x="40" y="84"><tspan class="dim">[ 0.214 ]</tspan> Montando módulos: java.core · c.runtime · python3 · css.render</text>
      <text class="boot ok l2b" x="620" y="84">[  OK  ]</text>
      <text class="boot l3" x="40" y="106"><tspan class="dim">[ 0.438 ]</tspan> Carregando rede neural (ML for Industry)...</text>
      <text class="boot ok l3b" x="620" y="106">[  OK  ]</text>
      <text class="boot l4" x="40" y="128"><tspan class="dim">[ 0.702 ]</tspan> Sincronizando repositórios com github.com</text>
      <text class="boot ok l4b" x="620" y="128">[  OK  ]</text>
      <text class="boot l5" x="40" y="150"><tspan class="dim">[ 0.955 ]</tspan> Verificando nível de café no sistema.........</text>
      <text class="boot ok l5b" x="620" y="150">[ 100% ]</text>
      <text class="boot l6" x="40" y="172"><tspan class="dim">[ 1.204 ]</tspan> Iniciando interface do operador</text>
      <text class="boot ok l6b" x="620" y="172">[  OK  ]</text>
    </g>

    <!-- barra de carregamento -->
    <text class="mono" x="40" y="198" font-size="11" fill="#4b6a8a">NEURAL CORE</text>
    <rect x="40" y="205" width="560" height="7" rx="3.5" fill="#0f1a2e"/>
    <rect class="bar" x="40" y="205" width="560" height="7" rx="3.5" fill="url(#neon)"/>
    <text class="mono pct" x="612" y="213" font-size="11" fill="#00f0ff">100%</text>

    <!-- nome -->
    <g class="title">
      <text class="mono gl1" x="40" y="272" font-size="56" font-weight="800" letter-spacing="6" fill="#00f0ff">GUSTAVO NUNES</text>
      <text class="mono gl2" x="40" y="272" font-size="56" font-weight="800" letter-spacing="6" fill="#ff2bd6">GUSTAVO NUNES</text>
      <text class="mono" x="40" y="272" font-size="56" font-weight="800" letter-spacing="6" fill="url(#neon)" filter="url(#glow)">GUSTAVO NUNES</text>
    </g>
    <g class="sub">
      <text class="mono" x="42" y="306" font-size="15" fill="#8b9bb4">// desenvolvedor em evolução · machine learning · java · c · python</text>
      <rect class="blink" x="652" y="294" width="9" height="15" fill="#00f0ff"/>
    </g>

    <!-- núcleo de IA -->
    <g class="hud">
      <circle cx="1010" cy="170" r="122" fill="none" stroke="#00f0ff" stroke-opacity=".12"/>
      <g class="spin"><circle cx="1010" cy="170" r="106" fill="none" stroke="#00f0ff" stroke-width="2" stroke-dasharray="3 9" stroke-opacity=".8"/></g>
      <g class="spinR"><circle cx="1010" cy="170" r="89" fill="none" stroke="#ff2bd6" stroke-width="2" stroke-dasharray="60 26 8 26" stroke-opacity=".85"/></g>
      <g class="spin2"><circle cx="1010" cy="170" r="70" fill="none" stroke="#7a5cff" stroke-width="6" stroke-dasharray="110 330" stroke-linecap="round"/></g>
      <circle class="pulse" cx="1010" cy="170" r="48" fill="url(#core)"/>
      <circle cx="1010" cy="170" r="30" fill="#03050a" stroke="#00f0ff" stroke-width="2"/>
      <text class="mono" x="1010" y="176" font-size="17" font-weight="700" fill="#00f0ff" text-anchor="middle">G·N</text>
      <text class="mono blink" x="1010" y="318" font-size="11" fill="#00f0ff" text-anchor="middle" letter-spacing="2">AI CORE // ONLINE</text>
    </g>
  </g>
  <rect x="1" y="1" width="1198" height="338" rx="17" fill="none" stroke="url(#neon)" stroke-opacity=".55" stroke-width="2"/>
</svg>
